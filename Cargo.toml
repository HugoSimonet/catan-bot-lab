[workspace]
resolver = "3"
members = ["crates/catan-core", "crates/catan-cli", "crates/catan-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# Index loops are clearer than iterator chains in board-topology code.
needless_range_loop = "allow"

[workspace.dependencies]
catan-core = { path = "crates/catan-core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false

[profile.test]
opt-level = 2
