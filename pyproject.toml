[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "catanbot"
version = "0.1.0"
description = "Settlers of Catan strategy bots, mass simulation and a self-taught reinforcement-learning bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2",
    "torch>=2.6",
    "polars>=1.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "openskill>=6",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel", "nbconvert", "maturin>=1.9,<2"]

[tool.maturin]
manifest-path = "crates/catan-py/Cargo.toml"
python-source = "python"
module-name = "catanbot._engine"
features = ["pyo3/extension-module"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests"]
